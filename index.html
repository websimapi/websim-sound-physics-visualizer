<html>
<head>
  <title>Sound Physics Visualizer</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>
  <div id="container">
    <div id="upload-overlay" class="overlay">
      <div class="upload-content">
        <h1>Sound Physics Visualizer</h1>
        <p>Upload an audio file to begin the physics visualization</p>
        <p class="instructions">Use mouse to orbit camera:<br>
           Left click + drag to rotate<br>
           Right click + drag to pan<br>
           Scroll to zoom</p>
        <input type="file" id="audio-upload" accept="audio/*">
        <button id="start-btn" disabled>Start Visualization</button>
      </div>
    </div>
    
    <div id="controls" class="hidden">
      <button id="play-pause">Pause</button>
      <div id="audio-controls">
        <input type="range" id="volume" min="0" max="1" step="0.1" value="0.5">
        <label for="volume">Volume</label>
      </div>
      <div id="visualization-controls">
        <select id="physics-mode">
          <option value="frequency">Frequency Cubes</option>
          <option value="waveform">Waveform Rings</option>
          <option value="combined">Combined Mode</option>
        </select>
      </div>
    </div>
  </div>
  
  <script type="module" src="audioAnalyzer.js"></script>
  <script type="module" src="physicsEngine.js"></script>
  <script type="module" src="visualizer.js"></script>
  <script type="module" src="main.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
